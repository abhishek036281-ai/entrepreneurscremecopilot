<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Entrepreneur Scheme Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center space-x-3 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-sm">
                        ⚡
                    </div>
                    <span class="text-slate-900 text-lg font-extrabold tracking-tight">Entrepreneur Scheme Copilot</span>
                </a>
                <div id="nav-auth"></div>
            </div>
        </div>
    </nav>

    <div class="max-w-md w-full mx-auto p-6 my-auto">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-200/80">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
                <p class="text-slate-500 text-sm mt-2">Log in to discover government schemes matched to your business</p>
            </div>

            <form id="loginForm" onsubmit="handleLoginForm(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm transition">
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-blue-600/20 text-sm">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-slate-500 border-t border-slate-100 pt-6">
                Don't have an account? 
                <a href="/register.html" class="text-blue-600 font-bold hover:underline">Register here</a>
            </div>
        </div>
    </div>

    <footer class="py-6 text-center text-xs text-slate-400">
        Entrepreneur Scheme Copilot — AI-Driven Scheme Matching Platform
    </footer>

    <script>
        async function handleLoginForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = 'Signing in...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Login failed');

                Auth.setToken(data.access_token, data.is_admin);
                showToast('Login successful!', 'success');
                
                setTimeout(() => {
                    if (data.is_admin) {
                        window.location.href = '/admin/index.html';
                    } else {
                        window.location.href = '/profile.html';
                    }
                }, 400);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }
    </script>
</body>
</html>
