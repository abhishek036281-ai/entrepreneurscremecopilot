<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Roadmap - Scheme Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="flex items-center space-x-2">
                    <span class="text-blue-600 text-2xl font-bold">Copilot</span>
                    <span class="text-gray-700 font-medium">for Entrepreneurs</span>
                </a>
                <div id="nav-auth"></div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10">
        <div class="mb-6 flex justify-between items-center">
            <a href="/recommendations.html" class="text-blue-600 hover:underline text-sm font-semibold">← Back to Recommendations</a>
            <a href="/dashboard.html" class="text-gray-600 hover:text-gray-900 text-sm font-medium">View Dashboard</a>
        </div>

        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 space-y-8">
            <div id="roadmapHeader" class="border-b border-gray-100 pb-6">
                <h1 class="text-3xl font-extrabold text-gray-900" id="schemeTitle">Application Roadmap</h1>
                <p class="text-gray-500 text-sm mt-1">Interactive step-by-step guidance tailored to your scheme requirements</p>
                
                <!-- Progress Bar -->
                <div class="mt-6">
                    <div class="flex justify-between text-xs font-semibold text-gray-600 mb-1">
                        <span>Application Progress</span>
                        <span id="progressPctText">0% Complete</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                        <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Timeline Steps -->
            <div id="timelineContainer" class="space-y-6 relative before:absolute before:inset-0 before:left-4 before:w-0.5 before:bg-gray-200">
                <div class="animate-pulse text-gray-400 py-10 text-center">Loading roadmap timeline...</div>
            </div>
        </div>
    </main>

    <script>
        let currentSchemeId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) {
                window.location.href = '/login.html';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            currentSchemeId = params.get('scheme_id');
            if (!currentSchemeId) {
                window.location.href = '/recommendations.html';
                return;
            }

            loadRoadmap();
        });

        async function loadRoadmap() {
            try {
                const res = await fetch(`/api/roadmap/${currentSchemeId}`, { headers: Auth.getHeaders() });
                if (!res.ok) throw new Error('Failed to load roadmap');
                const data = await res.json();
                renderRoadmap(data);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function renderRoadmap(data) {
            document.getElementById('schemeTitle').innerText = `Roadmap: ${data.scheme_name}`;

            const total = data.total_step_count;
            const completed = data.completed_step_count;
            const pct = Math.round((completed / total) * 100);

            document.getElementById('progressPctText').innerText = `${pct}% Complete (${completed}/${total} steps)`;
            document.getElementById('progressBar').style.width = `${pct}%`;

            const container = document.getElementById('timelineContainer');
            
            container.innerHTML = data.roadmap_steps.map((step, idx) => {
                const isDone = step.completed;
                return `
                    <div class="relative flex items-start space-x-4 pl-10">
                        <!-- Circle indicator -->
                        <button onclick="toggleStep(${idx})" class="absolute left-0 top-1 w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all ${isDone ? 'bg-emerald-600 text-white shadow-md' : 'bg-white border-2 border-gray-300 text-gray-400 hover:border-blue-500'}">
                            ${isDone ? '✓' : idx + 1}
                        </button>

                        <div class="bg-gray-50 hover:bg-gray-100/80 p-5 rounded-xl border border-gray-200/80 flex-1 transition">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-gray-900 text-base ${isDone ? 'line-through text-gray-500' : ''}">${step.title}</h3>
                                <button onclick="toggleStep(${idx})" class="text-xs font-semibold px-3 py-1 rounded-lg border transition ${isDone ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-white text-blue-600 border-blue-200 hover:bg-blue-50'}">
                                    ${isDone ? 'Completed' : 'Mark Done'}
                                </button>
                            </div>
                            <p class="text-xs text-gray-600 mt-1">${step.description}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleStep(index) {
            try {
                const res = await fetch(`/api/roadmap/${currentSchemeId}/toggle-step?step_index=${index}`, {
                    method: 'POST',
                    headers: Auth.getHeaders()
                });
                if (res.ok) {
                    loadRoadmap();
                }
            } catch (e) {
                showToast('Failed to update step', 'error');
            }
        }
    </script>
</body>
</html>
