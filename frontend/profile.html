<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Onboarding - Scheme Copilot</title>
    <script src="/js/app.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans text-slate-800">
    <div class="text-center space-y-3">
        <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-sm font-semibold text-slate-600">Redirecting to Entrepreneur Onboarding...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.isLoggedIn()) {
                window.location.href = '/login.html';
            } else {
                window.location.href = '/onboarding.html';
            }
        });
    </script>
</body>
</html>
