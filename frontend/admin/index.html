<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Scheme Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">
    <nav class="bg-gray-900 text-white border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <span class="bg-amber-500 text-gray-900 font-bold px-2 py-0.5 rounded text-xs uppercase">Admin Portal</span>
                    <span class="font-bold text-lg">Entrepreneur Scheme Copilot</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard.html" class="text-gray-300 hover:text-white text-sm">User View</a>
                    <button onclick="handleLogout()" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1.5 rounded">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900">Government Scheme Management</h1>
                <p class="text-gray-500 text-sm mt-1">Manage database schemes, eligibility criteria, required documents & official links</p>
            </div>
            <button onclick="openSchemeModal()" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold px-5 py-2.5 rounded-xl text-sm shadow-md transition">
                + Add New Scheme
            </button>
        </div>

        <!-- Table of Schemes -->
        <div class="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 uppercase text-xs font-semibold border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Scheme Name & Ministry</th>
                            <th class="px-6 py-4">Category</th>
                            <th class="px-6 py-4">Funding Max</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminSchemesTable" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-gray-400">Loading admin schemes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scheme Add/Edit Modal -->
    <div id="schemeModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 space-y-6 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-900">Add New Scheme</h2>
                <button onclick="closeSchemeModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>

            <form id="schemeForm" onsubmit="handleSchemeFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="scheme_id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Scheme Name *</label>
                    <input type="text" id="name" required class="w-full px-3 py-2 rounded-lg border text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Ministry / Department *</label>
                    <input type="text" id="ministry" required class="w-full px-3 py-2 rounded-lg border text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Category *</label>
                        <input type="text" id="category" required placeholder="Subsidy / Loan / Grant" class="w-full px-3 py-2 rounded-lg border text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Max Funding (₹)</label>
                        <input type="number" id="funding_max" value="1000000" class="w-full px-3 py-2 rounded-lg border text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Description *</label>
                    <textarea id="description" required rows="2" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Benefits & Financial Support *</label>
                    <textarea id="benefits" required rows="2" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Required Documents (Comma-separated)</label>
                    <input type="text" id="required_documents" placeholder="Aadhaar Card, PAN Card, DPR" class="w-full px-3 py-2 rounded-lg border text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Official Portal URL *</label>
                    <input type="url" id="official_url" required placeholder="https://scheme.gov.in" class="w-full px-3 py-2 rounded-lg border text-sm">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeSchemeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold px-6 py-2 rounded-lg text-sm shadow-md">
                        Save Scheme
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
                showToast('Admin login required', 'error');
                setTimeout(() => { window.location.href = '/login.html'; }, 800);
                return;
            }
            loadAdminSchemes();
        });

        async function loadAdminSchemes() {
            const table = document.getElementById('adminSchemesTable');
            try {
                const res = await fetch('/api/admin/schemes', { headers: Auth.getHeaders() });
                if (!res.ok) throw new Error('Failed to load schemes');
                const schemes = await res.json();
                
                table.innerHTML = schemes.map(s => `
                    <tr class="hover:bg-gray-50/80 transition">
                        <td class="px-6 py-4 font-mono text-xs text-gray-400">#${s.id}</td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-gray-900">${s.name}</div>
                            <div class="text-xs text-gray-500">${s.ministry}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="bg-blue-50 text-blue-700 text-xs px-2 py-0.5 rounded font-semibold">${s.category}</span>
                        </td>
                        <td class="px-6 py-4 font-semibold text-gray-800">₹${s.funding_max ? s.funding_max.toLocaleString() : 'Variable'}</td>
                        <td class="px-6 py-4">
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-bold">${s.status}</span>
                        </td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="editScheme(${s.id})" class="text-blue-600 hover:underline font-medium text-xs">Edit</button>
                            <button onclick="deleteScheme(${s.id})" class="text-red-600 hover:underline font-medium text-xs">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                table.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-red-600">${err.message}</td></tr>`;
            }
        }

        function openSchemeModal() {
            document.getElementById('scheme_id').value = '';
            document.getElementById('schemeForm').reset();
            document.getElementById('modalTitle').innerText = 'Add New Scheme';
            document.getElementById('schemeModal').classList.remove('hidden');
        }

        function closeSchemeModal() {
            document.getElementById('schemeModal').classList.add('hidden');
        }

        async function editScheme(id) {
            try {
                const res = await fetch(`/api/schemes/${id}`);
                const scheme = await res.json();
                
                document.getElementById('scheme_id').value = scheme.id;
                document.getElementById('name').value = scheme.name;
                document.getElementById('ministry').value = scheme.ministry;
                document.getElementById('category').value = scheme.category;
                document.getElementById('funding_max').value = scheme.funding_max || 0;
                document.getElementById('description').value = scheme.description;
                document.getElementById('benefits').value = scheme.benefits;
                document.getElementById('required_documents').value = (scheme.required_documents || []).join(', ');
                document.getElementById('official_url').value = scheme.official_url;
                
                document.getElementById('modalTitle').innerText = 'Edit Scheme';
                document.getElementById('schemeModal').classList.remove('hidden');
            } catch (e) {
                showToast('Failed to fetch scheme', 'error');
            }
        }

        async function handleSchemeFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('scheme_id').value;
            const docsStr = document.getElementById('required_documents').value;
            const docsList = docsStr ? docsStr.split(',').map(s => s.trim()) : [];

            const payload = {
                name: document.getElementById('name').value,
                ministry: document.getElementById('ministry').value,
                category: document.getElementById('category').value,
                funding_max: parseFloat(document.getElementById('funding_max').value),
                description: document.getElementById('description').value,
                benefits: document.getElementById('benefits').value,
                required_documents: docsList,
                official_url: document.getElementById('official_url').value,
                target_beneficiaries: ["General", "OBC", "SC", "ST", "Women"],
                states: ["All"],
                business_types: ["Manufacturing", "Service", "Trading"],
                industries: ["All"]
            };

            const url = id ? `/api/admin/schemes/${id}` : '/api/admin/schemes';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: Auth.getHeaders(),
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Operation failed');
                
                showToast(id ? 'Scheme updated!' : 'Scheme created!', 'success');
                closeSchemeModal();
                loadAdminSchemes();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteScheme(id) {
            if (!confirm('Are you sure you want to delete this scheme?')) return;
            try {
                const res = await fetch(`/api/admin/schemes/${id}`, {
                    method: 'DELETE',
                    headers: Auth.getHeaders()
                });
                if (res.ok) {
                    showToast('Scheme deleted', 'success');
                    loadAdminSchemes();
                }
            } catch (e) {
                showToast('Failed to delete scheme', 'error');
            }
        }
    </script>
</body>
</html>
